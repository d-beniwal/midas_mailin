# Conda environment for the midas_mailin calibration/integration workflow.
# Deliberately separate from the mail-in acquisition GUI's environment (PyQt5,
# epics, SQLAlchemy): the GUI only launches this env's python as a subprocess.
#
# Create:   conda env create -f environment.yml
# Update:   conda env update -f environment.yml --prune
# Activate: conda activate midas_mailin
name: midas_mailin
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.4.6
      - scipy==1.17.1
      - matplotlib==3.10.9
      - contourpy==1.3.3
      - tifffile==2026.5.15
      - scikit-image==0.26.0
      - torch==2.12.0
      - h5py==3.16.0
      - hdf5plugin==6.0.0
      - midas-suite==0.12.0
      - pyyaml
      - -e .
